<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, follow">
  <title>Página no encontrada | Jardín Infantil CREAR</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio del Jardín Infantil CREAR en Bogotá.">
  <link rel="icon" href="/img/logo2.png" type="image/png">
  <meta name="theme-color" content="#7c4f9b">
  <style>
    :root {
      --brand-naranja: #7c4f9b;
      --brand-rojo: #4291cf;
      --brand-azul: #4291cf;
      --texto-900: #1e293b;
      --texto-500: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Zilla Slab', 'Archer', Georgia, serif;
      color: var(--texto-900);
      background: linear-gradient(160deg, #fff7ed 0%, #ffffff 45%, #eff6ff 100%);
      text-align: center;
    }

    .card {
      max-width: 560px;
      background: #fff;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 45px rgba(15, 23, 42, .10);
      padding: 48px 32px;
    }

    .codigo {
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: 700;
      line-height: 1;
      color: var(--brand-naranja);
      margin: 0;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2rem);
      margin: 12px 0 10px;
    }

    p {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--texto-500);
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: .95rem;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-principal {
      background: var(--brand-rojo);
      color: #fff;
      box-shadow: 0 10px 22px rgba(124, 79, 155, .28);
    }

    .btn-secundario {
      background: var(--brand-naranja);
      color: #fff;
      box-shadow: 0 10px 22px rgba(124, 79, 155, .28);
    }

    .nota {
      margin: 26px 0 0;
      font-size: .85rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="codigo">404</p>
    <h1>¡Esta página se nos perdió!</h1>
    <p>
      Parece que la dirección que buscas no existe o cambió de lugar.
      Pero en CREAR siempre hay un rinconcito para tu familia.
    </p>

    <div class="acciones">
      <a class="btn btn-principal" href="/">Volver al inicio</a>
      <a class="btn btn-secundario" href="https://wa.me/573104711322" target="_blank" rel="noopener noreferrer">
        Escribir por WhatsApp
      </a>
    </div>

    <p class="nota">Jardín Infantil y Preescolar CREAR · Bogotá, Colombia</p>
  </main>
</body>

</html>
